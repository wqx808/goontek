<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Goontek</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bar" id="bar">
      <!-- Row 1: open tabs -->
      <div class="tabstrip">
        <div class="tabs" id="tabs" role="tablist" aria-label="Panel tabs"></div>
        <button type="button" id="newtab" class="icon" title="New tab (Ctrl+T)" aria-label="New tab">+</button>
      </div>

      <!-- Row 2: address -->
      <form class="omni" id="omni">
        <button type="button" id="back" class="icon" title="Back (Alt+←)" aria-label="Back">‹</button>
        <button type="button" id="forward" class="icon" title="Forward (Alt+→)" aria-label="Forward">›</button>
        <button type="button" id="refresh" class="icon" title="Reload (Ctrl+R)" aria-label="Reload">↻</button>
        <input
          id="url"
          type="text"
          inputmode="url"
          autocomplete="off"
          spellcheck="false"
          placeholder="Type a URL or search…"
          aria-label="Address"
        />
        <button type="button" id="fav" class="icon" title="Add to favourites (Ctrl+D)" aria-label="Add to favourites" aria-pressed="false">☆</button>
      </form>

      <!-- Row 2b: favourites (hidden when empty) -->
      <div class="favs" id="favs" aria-label="Favourites"></div>

      <!-- Row 3: layout width, volume, privacy -->
      <div class="actions">
        <select id="width" class="ghost" aria-label="Layout width" title="Width the page is laid out at, scaled to fit the panel">
          <option value="auto">auto</option>
          <option value="900">900</option>
          <option value="1100">1100</option>
          <option value="1280">1280</option>
          <option value="1600">1600</option>
        </select>

        <div class="vol" id="volwrap">
          <button type="button" id="mute" class="vol-icon" title="Mute" aria-label="Mute" aria-pressed="false">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path class="spk" d="M3.5 6h2L8.5 3.5v9L5.5 10h-2z" />
              <path class="wave wave-1" d="M10.6 6.1a2.6 2.6 0 0 1 0 3.8" />
              <path class="wave wave-2" d="M12.3 4.4a5 5 0 0 1 0 7.2" />
              <path class="cross" d="M10.8 6.2l3.4 3.6M14.2 6.2l-3.4 3.6" />
            </svg>
          </button>
          <input id="vol" type="range" min="0" max="100" step="1" value="100" aria-label="Volume" />
        </div>

        <span class="spacer"></span>

        <button type="button" id="clear" class="ghost" title="Delete this session's URLs from browser history">
          clear
        </button>
        <button type="button" id="panic" class="ghost danger" title="Minimize and mute (Ctrl+Shift+H)">
          hide
        </button>
        <button type="button" id="settings" class="icon" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <circle cx="8" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
              d="M8 1.4v1.8M8 12.8v1.8M14.6 8h-1.8M3.2 8H1.4M12.67 3.33l-1.27 1.27M4.6 11.4l-1.27 1.27M12.67 12.67l-1.27-1.27M4.6 4.6L3.33 3.33"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="stage" id="stage">
      <div class="empty" id="empty">
        <p>Nothing loaded.</p>
        <p class="hint">Type a URL above to begin.</p>
      </div>
    </main>

    <!-- Settings -->
    <div class="sheet" id="settingsPanel" hidden>
      <div class="sheet-head">
        <span>Settings</span>
        <button type="button" id="settingsClose" class="ghost">close</button>
      </div>
      <div class="sheet-body">
        <section>
          <h3>Appearance</h3>
          <label class="row">
            <span>Theme</span>
            <select id="setTheme" class="ghost">
              <option value="system">system</option>
              <option value="light">light</option>
              <option value="dark">dark</option>
            </select>
          </label>
          <div class="row">
            <span>Accent</span>
            <div class="swatches" id="swatches"></div>
          </div>
        </section>

        <section>
          <h3>Show in panel</h3>
          <label class="row"><span>Favourites</span><input type="checkbox" id="uiFavourites" /></label>
          <label class="row"><span>Volume</span><input type="checkbox" id="uiVolume" /></label>
          <label class="row"><span>Width</span><input type="checkbox" id="uiWidth" /></label>
          <label class="row"><span>Clear history</span><input type="checkbox" id="uiClear" /></label>
          <label class="row"><span>Hide</span><input type="checkbox" id="uiHide" /></label>
        </section>

        <section>
          <h3>Browsing</h3>
          <label class="row">
            <span>Tab limit</span>
            <select id="setMaxTabs" class="ghost">
              <option value="4">4</option>
              <option value="8">8</option>
              <option value="12">12</option>
            </select>
          </label>
          <label class="row">
            <span>Search with</span>
            <select id="setSearch" class="ghost">
              <option value="duckduckgo">DuckDuckGo</option>
              <option value="google">Google</option>
              <option value="brave">Brave</option>
              <option value="startpage">Startpage</option>
            </select>
          </label>
          <label class="row">
            <span>Clear history on hide</span>
            <input type="checkbox" id="setScrubOnHide" />
          </label>
        </section>

        <section>
          <h3>Support</h3>
          <button type="button" id="reportBug" class="wide">Report a bug</button>
          <button type="button" id="donate" class="wide">Donate (Solana)</button>
          <div id="donateBox" class="donate" hidden>
            <div id="qr" class="qr"></div>
            <code id="wallet"></code>
            <button type="button" id="copyWallet" class="wide">Copy address</button>
          </div>
        </section>
      </div>
    </div>

    <!-- Diagnostics (Ctrl+Shift+D) -->
    <div class="diag" id="diag" hidden>
      <div class="diag-head">
        <span>Diagnostics</span>
        <button type="button" id="diagclose" class="ghost">close</button>
      </div>
      <pre id="diagbody"></pre>
    </div>

    <!-- Shown in place of everything else while minimized. Deliberately blank. -->
    <div class="curtain" id="curtain" hidden>
      <button type="button" id="reopen" class="reopen" title="Reopen (Ctrl+Shift+H)">reopen</button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
